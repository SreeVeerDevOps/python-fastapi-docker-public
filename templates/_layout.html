<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ name }}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    {#- Shared look for the list pages (same design as networks.html). -#}
    <style>
        :root {
            --bg: #070b16; --panel: rgba(255,255,255,0.06); --border: rgba(255,255,255,0.12);
            --text: #e8ecf5; --muted: #9aa5bd; --accent: #4f9dff; --ok: #3ddc97; --warn: #ffc857; --err: #ff6b6b;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
        a { color: var(--accent); }
        .banner {
            padding: 4rem 1.5rem 6rem;
            background:
                linear-gradient(180deg, rgba(7,11,22,0.45) 0%, var(--bg) 100%),
                url("{% block banner %}https://images.unsplash.com/photo-1544197150-b99a580bb7a8?auto=format&fit=crop&w=2000&q=80{% endblock %}") center / cover no-repeat;
        }
        .wrap { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; }
        .banner .wrap { padding: 0; }
        .back { color: var(--muted); text-decoration: none; font-size: .9rem; }
        .back:hover { color: var(--text); }
        .eyebrow { display: inline-block; margin-left: .75rem; font-size: .75rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
                   padding: .2rem .65rem; border-radius: 999px; background: rgba(79,157,255,0.15); border: 1px solid rgba(79,157,255,0.4); color: var(--text); }
        h1 { font-size: clamp(2rem, 5vw, 3rem); margin: 1rem 0 .5rem; font-weight: 800; }
        .lead { color: #c9d2e6; margin: 0; }
        .stats { margin-top: -3.5rem; position: relative; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }
        .stat { background: rgba(16,22,40,0.85); backdrop-filter: blur(14px); border: 1px solid var(--border); border-radius: 16px; padding: 1.1rem 1.25rem; }
        .stat .label { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
        .stat .value { font-size: 1.6rem; font-weight: 800; margin-top: .25rem; }
        .stat .value.small { font-size: .95rem; font-weight: 600; word-break: break-all; padding-top: .45rem; }
        .search { margin: 2rem 0 1rem; }
        .search input {
            width: 100%; padding: .85rem 1rem; border-radius: 12px; font: inherit; color: var(--text);
            background: var(--panel); border: 1px solid var(--border);
        }
        .search input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
        .sub { margin: 1.5rem 0; border: 1px solid var(--border); border-radius: 16px; overflow: hidden; background: rgba(255,255,255,0.03); }
        .sub-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; padding: 1rem 1.25rem; background: var(--panel); border-bottom: 1px solid var(--border); }
        .sub-head h2 { margin: 0; font-size: 1.1rem; }
        .sub-head .id { color: var(--muted); font-size: .8rem; font-family: ui-monospace, Consolas, monospace; }
        .pill { font-size: .8rem; padding: .25rem .7rem; border-radius: 999px; background: rgba(79,157,255,0.15); border: 1px solid rgba(79,157,255,0.4); white-space: nowrap; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: .92rem; }
        th, td { padding: .7rem 1.25rem; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
        th { color: var(--muted); font-weight: 500; font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
        tr:last-child td { border-bottom: 0; }
        td.num, th.num { text-align: right; }
        td.idx { color: var(--muted); width: 3rem; }
        .mono, .cidr { font-family: ui-monospace, Consolas, monospace; font-size: .82rem; }
        .cidr { display: inline-block; background: rgba(255,255,255,0.07); border-radius: 6px; padding: .1rem .45rem; margin: 0 .25rem .25rem 0; }
        .tag { display: inline-block; font-size: .78rem; padding: .1rem .55rem; border-radius: 999px; background: rgba(255,255,255,0.07); border: 1px solid var(--border); white-space: nowrap; }
        .tag.ok { color: var(--ok); border-color: rgba(61,220,151,0.4); background: rgba(61,220,151,0.1); }
        .tag.warn { color: var(--warn); border-color: rgba(255,200,87,0.4); background: rgba(255,200,87,0.1); }
        .tag.err { color: var(--err); border-color: rgba(255,107,107,0.4); background: rgba(255,107,107,0.1); }
        .note { padding: 1rem 1.25rem; color: var(--muted); }
        .note.err { color: #ffb3b3; }
        .empty { text-align: center; color: var(--muted); padding: 3rem 1rem; line-height: 1.6; }
        .empty b { color: var(--text); }
        code { font-family: ui-monospace, Consolas, monospace; background: rgba(255,255,255,0.07); border-radius: 4px; padding: 0 .3rem; }
        footer { padding: 3rem 1rem; }
    </style>
</head>
<body>
    <header class="banner">
        <div class="wrap">
            <a href="/" class="back">&larr; Back to home</a>{% block eyebrow %}{% endblock %}
            <h1>{% block heading %}{{ name }}{% endblock %}</h1>
            <p class="lead">{% block lead %}{% endblock %}</p>
        </div>
    </header>

    <main class="wrap">
        <div class="stats">{% block stats %}{% endblock %}</div>
        {% block content %}{% endblock %}
    </main>
    <footer></footer>

    <script>
        // Filter: hides non-matching rows (tr.row) in every section.sub and updates its .count pill.
        (function () {
            var input = document.getElementById('filter');
            if (!input) return;
            input.addEventListener('input', function () {
                var q = input.value.trim().toLowerCase();
                document.querySelectorAll('section.sub').forEach(function (sec) {
                    var rows = sec.querySelectorAll('tr.row');
                    if (!rows.length) return;
                    var shown = 0;
                    rows.forEach(function (tr) {
                        var hit = !q || tr.textContent.toLowerCase().indexOf(q) !== -1;
                        tr.hidden = !hit;
                        if (hit) shown++;
                    });
                    var count = sec.querySelector('.count');
                    if (count) count.textContent = q ? shown + ' of ' + rows.length : rows.length;
                    sec.querySelector('.table-wrap').hidden = shown === 0;
                    sec.querySelector('.no-match').hidden = shown !== 0;
                });
            });
        })();
    </script>
</body>
</html>
